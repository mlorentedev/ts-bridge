version: "2"

run:
  timeout: 5m

linters:
  # `standard` enables errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - goconst
    - funlen
    - gocyclo
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 9
    funlen:
      lines: 40
      # The documented limit is on length; statement count is a second, stricter
      # reading nobody agreed to.
      statements: -1
      ignore-comments: false
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    goconst:
      min-len: 3
      min-occurrences: 3
      # Repeated literals in table-driven test data are not constants worth
      # extracting. In v1, test files were excluded from goconst analysis; v2
      # exclusion rules only filter *reported* issues, not the occurrence count,
      # so ignore test files explicitly to preserve the v1 behavior.
      ignore-tests: true
    gosec:
      excludes:
        - G117
    misspell:
      locale: US
    staticcheck:
      # v1 enabled only `staticcheck` (SA*), not `gosimple` (S1*) or
      # `stylecheck` (ST1*), which v2 merged into this single linter. Keep the
      # SA-only scope so the v1->v2 migration doesn't silently add new
      # style/simplify checks (this PR is a toolchain bump, not new rules).
      checks:
        - all
        - -S1*
        - -ST1*
        - -QF1*
  exclusions:
    # Preserve v1's `issues.exclude-use-default: true` behavior.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - site
    rules:
      - path: '_test\.go'
        linters:
          - funlen
          - gocyclo
          - goconst
          - unparam
      - linters:
          - unparam
        text: 'acceptLoop.*result 0.*is always nil'

# golangci-lint v2 runs formatters only when listed here; `linters` never runs
# gofmt. Without this block, `golangci-lint run` passes on unformatted code (#466).
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

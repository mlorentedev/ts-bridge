# Arming envelope for the unattended run. Committed on the run branch, never merged;
# the run reads the committed copy and halts if the working tree differs.
version: 1
run_id: "ts-bridge-autopilot-2026-11-11"
armed_by: manu
armed_at: 2026-11-11T07:53:00Z
expires_at: 2026-11-11T19:53:00Z
objective: "Carry the stable host/CLI line forward: land the open triaged PRs, then HOST-011 (#565, control-session liveness from Self.Online), the Headscale discover fix (#717), the HOST-008 handoff note, and #713, one at a time, each to a merged or clearly parked PR."
scope:
  write_paths:
    - "cmd/**"
    - "internal/**"
    - "scripts/**"
    - "docs/**"
    - "specs/**"
    - "Makefile"
    - ".env.example"
    - "README.md"
  frozen_paths:
    - ".github/**"
    - "harness/**"
    - ".agent/**"          # frozen for PRs; this run branch is the envelope's only home
    - "**/AGENTS.md"
    - "site/**"
    - "go.mod"
    - "go.sum"
    - "mise.toml"
  max_files: 12
  max_loc: 300
allowed_commands: [dotf, gh, git, go, golangci-lint, gosec, bats, shellcheck, bash, zsh, make, mise, jq, python3, docker, curl]
queue:
  source: bitacora
  filter: "open PRs first, then #565 #717 HOST-008-handoff #713"
  order: ["land-open-prs", 565, 717, "host-008-handoff", 713]
  notes:
    land-open-prs: "#714 (BUG-526; after it merges archive BUG-526 and move #526 to Done), #715 (archive PR: SEC-631, QA-606, REL-376), #716 (#707). Triage every reviewer output on the current head, then `dotf pr triage-queue --pr N` and `dotf pr land N`; merge origin/master when BEHIND (never rebase, never force-push). If PR-Agent never publishes a complete review on the head, do NOT merge: leave the PR open and say so in the report (ask degrades to deny)."
    565: "Worktree fix-issue-565-control-liveness (branch fix/issue-565-control-liveness; it already carries health_addr 127.0.0.1:9090 in scripts/e2e/mesh_linux.sh). SDD spec HOST-011 via `dotf spec init`. Measured 2026-11-11 on the local mesh (Headscale v0.29.7 stopped 07:43:30 for 4 min): IPN bus stayed Running, no health warnings, /health/ready 200 throughout; Status().Self.Online went false by 07:43:33 and true again 14 s after restart (07:47:59 -> 07:48:13). Record this in verification.md first. Design: poll Self.Online through an injected status func and ticker (10 s poll, down after 3 consecutive offline = 30 s bound, up on the first online), feeding the existing `control` source with control_plane_unreachable; health warnings are not a signal. Red-first unit tests on a fake sequence. e2e outage case (run.sh docker stop/start + guest poll) as a second PR if the first passes ~300 LOC. Independent spec review (`dotf spec review --reviewer <live pool id>`) before archive."
    717: "Headscale discover: /api/v1/device 404s on v0.29.7; use /api/v1/node {nodes:[...]}, ipAddresses, givenName/name, online; literal fixture from a real response; mesh e2e case. Fresh worktree; SDD if 50-300 LOC."
    host-008-handoff: "Comment on #522 only with what is now known (control-session loss measured locally, the bus is insufficient, fix in HOST-011 #565). Add a dated note to specs/HOST-008-host-serve-mode/verification.md without editing ACs. Do not restate or reassign the live ACs: a copilot session (mlorentedev-host-acceptance) owns live acceptance."
    713: "Windows LocalAPI readiness after `net start`: measure on the Windows VM first; implement only if the measurement shows a gap."
  exclude_note: "Not this run's: #523 (release 2.0.0, Manu only, never merge), #428 and #420 (never close), #691 (owner decision: policy outcome), #709 (touches CI, Manu merges). PRs touching .github/, harness/, .agent/, site/ or AGENTS.md are left for Manu. Never enrol a key for hs-bootstrap on this Mac. VMs are shared with session feat-vm-linux-exec-3c (notified 2026-11-11T07:50Z); run `make e2e-clean` after each kept run."
  max_items: 6
budget:
  max_iterations: 16
  max_minutes_per_iteration: 60
  max_consecutive_failures: 2
authority:
  merge: standing-grant          # .github/merge-grant.yml exists on master (checked at arming)
  push: true
  open_pr: true
  advisor_tier: top
host:
  wake_lock: "caffeinate -dimsu for the run's lifetime; on AC power, lid must stay open"

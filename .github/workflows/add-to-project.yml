name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

# Note: dependabot PRs are intentionally excluded — they are automated
# dependency updates that do not need project board tracking. The
# `github.actor` check ensures only human-created PRs reach the board.

jobs:
  add-to-project:
    # Fork PRs run without repository secrets — BITACORA_PAT would be empty and the
    # job would fail (Codex review on kubelab#237). Skip them; fork PRs reach the
    # board via the rollout backfill or a manual item-add.
    # Dependabot PRs are also skipped — they are automated and do not need board tracking.
    if: (github.event_name == 'issues' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Pin a real release: actions/add-to-project@v1 does NOT resolve (no floating v1 tag).
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          github-token: ${{ secrets.BITACORA_PAT }}

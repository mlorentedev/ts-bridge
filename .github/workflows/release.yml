name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go
          # Use a PAT instead of the default GITHUB_TOKEN so PRs created by
          # release-please trigger the standard `pull_request` workflows
          # (required status checks: test, lint, security). PRs opened by
          # GITHUB_TOKEN are deliberately suppressed by GitHub to prevent
          # workflow recursion, which would otherwise leave the release PR
          # in BLOCKED state under branch protection.
          # Falls back to GITHUB_TOKEN if the secret is not yet configured,
          # so this workflow keeps working during the rollout.
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v ./...

      - name: Build and Package
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          
          # Platforms to build
          PLATFORMS=("linux/amd64" "linux/arm64" "windows/amd64" "windows/arm64" "darwin/amd64" "darwin/arm64")
          
          mkdir -p dist/artifacts

          for PLATFORM in "${PLATFORMS[@]}"; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            
            # Set binary name (add .exe for windows)
            BINARY_NAME="ts-bridge"
            if [ "$OS" = "windows" ]; then
              BINARY_NAME="ts-bridge.exe"
            fi
            
            # Create a staging directory for this specific bundle
            STAGING="dist/ts-bridge-${OS}-${ARCH}"
            mkdir -p "${STAGING}"
            
            # Build the binary into the staging directory
            echo "Building for ${OS}/${ARCH}..."
            GOOS=$OS GOARCH=$ARCH go build -ldflags="${LDFLAGS}" -o "${STAGING}/${BINARY_NAME}" ./cmd/ts-bridge/
            
            # Copy relevant assets
            cp .env.example README.md LICENSE "${STAGING}/"
            cp -r scripts/ "${STAGING}/"
            
            # Create the archive
            cd dist
            if [ "$OS" = "windows" ]; then
              zip -r "artifacts/ts-bridge-${VERSION}-${OS}-${ARCH}.zip" "ts-bridge-${OS}-${ARCH}"
            else
              tar -czf "artifacts/ts-bridge-${VERSION}-${OS}-${ARCH}.tar.gz" "ts-bridge-${OS}-${ARCH}"
            fi
            cd ..
          done

          # Generate checksums for the final archives
          cd dist/artifacts && sha256sum * > ../checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/artifacts/*
            dist/checksums.txt

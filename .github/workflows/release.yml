name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test -v ./...

      - name: Build and Package
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist/bin

          # Build binaries
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-windows-arm64.exe .
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/bin/ts-bridge-darwin-arm64 .

          # Create distribution bundles
          mkdir -p dist/bundle
          cp -r scripts/ .env.example README.md LICENSE dist/bundle/
          
          # Create archives
          tar -czf dist/ts-bridge-source-${VERSION}.tar.gz -C dist/bundle .
          zip -r dist/ts-bridge-source-${VERSION}.zip dist/bundle/*

          # Checksums for binaries
          cd dist/bin && sha256sum * > ../checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/bin/*
            dist/ts-bridge-source-*.tar.gz
            dist/ts-bridge-source-*.zip
            dist/checksums.txt

name: Repo hygiene

# Guards that need no toolchain (lesson numbering/index integrity, SHA-pinned actions,
# workflow credential posture, PR-Agent review-published parsing) run under bash and zsh and
# print what failed, plus a toolchain-backed lint pass (actionlint + shellcheck, #345) over
# every workflow's YAML shape and embedded shell.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lessons numbering and index
        run: bash scripts/check-lessons.sh
      - name: Actions pinned to commit SHAs
        run: bash scripts/check-actions-pinned.sh
      - name: Workflows carry no default credential
        run: bash scripts/check-workflow-permissions.sh
      # The fixture suite runs every case under bash AND zsh, and fails when either is missing.
      # ubuntu-latest ships no zsh, so without this step the second shell was silently skipped.
      - name: Install zsh for the two-shell fixture suite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: That guard still refuses each way the posture can widen
        run: bash scripts/tests/test-workflow-permissions.sh
      - name: That guard tolerates a null comment body (#345 regression)
        run: bash scripts/tests/test-check-review-published.sh
      - name: Site changes keep their pull-request build gate
        run: bash scripts/tests/test-site-pr-workflow.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # ubuntu-latest ships shellcheck preinstalled; actionlint shells out to it to lint
      # every embedded `run:` block, not just the workflow YAML shape.
      - name: Lint workflows and their shell (actionlint + shellcheck)
        run: |
          gopath_bin="$(go env GOPATH)/bin"
          "${gopath_bin}/actionlint" -shellcheck=shellcheck
name: Repo hygiene

# Three guards that need no toolchain: lesson numbering/index integrity, SHA-pinned actions,
# and workflow credential posture. All three scripts run under bash and zsh and print what failed.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lessons numbering and index
        run: bash scripts/check-lessons.sh
      - name: Actions pinned to commit SHAs
        run: bash scripts/check-actions-pinned.sh
      - name: Workflows carry no default credential
        run: bash scripts/check-workflow-permissions.sh
      - name: That guard still refuses each way the posture can widen
        run: bash scripts/tests/test-workflow-permissions.sh

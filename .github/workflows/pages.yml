name: Deploy to GitHub Pages

# The build and deploy live in the fleet's shared pages workflow (ci-workflows
# CI-006). This caller owns the triggers, the concurrency group and the
# permissions ceiling.
on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mlorentedev/ci-workflows/.github/workflows/pages.yml@2355330358344bb08c0b7a305be4ed6488f23d0c # v0.6.0

name: Deploy to GitHub Pages

# The build and deploy live in the fleet's shared pages workflow (ci-workflows
# CI-006). This caller owns the triggers, the concurrency group and the
# permissions ceiling.
on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mlorentedev/ci-workflows/.github/workflows/pages.yml@fb5c58afa4249e5a0dd911bd443be1f361415d80 # v0.9.0

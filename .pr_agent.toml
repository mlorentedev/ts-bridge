# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer, measured rather than assumed (2026-08-31,
# the 29 most recent non-dependabot PRs):
#
#   real CodeRabbit review (`## Walkthrough`)   10   (34 %)
#   quota decline (`Review limit reached`)      17   (59 %)
#   `Review skipped`                             2
#
# CodeRabbit is not a check-run in this repository at all — the rollup on #310 was
# `test, test-windows, smoke, lint, security, build-matrix x6, mutation, GitGuardian`
# — so a declined review leaves no trace in CI, and required checks are
# `test, lint, security`. Two thirds of PRs here merge with no machine review and
# nothing says so. That is the queue this removes: a reviewer whose capacity is ours
# rather than a vendor's.
#
# Ported from mlorentedev/dotfiles (`.pr_agent.toml`, TOOL-013 #786) via the
# mlorentedev/kubelab adaptation (TOOL-021 #1140). Numbers, paths and the ignore list
# below are re-derived for this repo; the model-chain reasoning is inherited and
# cited by issue so it can be checked at source.

[config]
# The model, its fallback and custom_model_max_tokens are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here.

# The shared workflow's NaN step sets custom_model_max_tokens but not this cap,
# whose upstream default (32000) would clip the diff, so it stays here.
max_model_tokens = 200000

response_language = "en-US"

# `AGENTS.md` is the only context file that exists here. No root `CLAUDE.md` and no
# `.claude/CLAUDE.md` (both checked 2026-08-31), so naming either would hand the
# reviewer a source it cannot read — a rule that looks like rigour and asserts nothing.
repo_context_files = ["AGENTS.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072, recommendation was deletion). An instruction ignored 94 %
# of the time is a comment, not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

This repository already runs go vet, golangci-lint v2 (pinned in CI), gosec, `go test
-race` on Linux, the Windows test job, the BATS smoke suite and a scheduled gremlins
mutation run. Do not restate what those report; repeating it is noise that trains the
reader to skim.

Spend the budget on what static analysis cannot see:

- a test that passes vacuously. This repo has a named class of it: assertions written
  against a hand-built replica of the Cobra command tree instead of the production one
  (#279, ADR-013). A finding on a test that cannot see the wiring it claims to check is
  worth more than a style note.
- a guard that cannot fail the way its comment claims, or that perturbs the thing it
  measures.
- precedence and unset-vs-zero confusion in configuration. Flags > env > YAML >
  defaults is the contract (ADR-008/ADR-012), and an unset numeric flag clobbering a
  lower layer has shipped twice here (#282, then #286 for the fix's regression).
- cross-file consequences a single-hunk reader misses: a claim repeated in README,
  `docs/runbooks/`, `site/src/content/docs/` and AGENTS.md where only one of them is
  edited, or a documented flag that the binary rejects (measured live on #305: `init`
  has no `--auth-key-file`, only `connect` does).
- anything that puts a credential in a transcript, a log line, an argv or the process
  table, including in documentation examples.

A REAL finding needs a concrete
trace: file and line, failing input, or a command and its output. Do not flag an import
or dependency as missing when CI compiles and tests pass; trust the manifests. Write in
English. Conventional Commits and no AI attribution are enforced here, so do not propose
commit messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline (dotfiles measured 2 bot comments and 0 inline across three
# PRs before noticing). 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call. This repo keeps no credential material in-tree (no
# SOPS/age store, no keys — the only secrets live in GitHub's own stores), so this list
# is about spend and signal, not leakage:
#   - the generated review transcript and the site build output are machine artefacts;
#   - the docs lockfile is 6k+ lines of resolved URLs a human already reviewed in the
#     PR that bumped it, and lockfiles are excluded from the review cap by policy;
#   - archived specs are a closed audit trail, re-reviewing them spends inference on
#     text that has already been reviewed once.
glob = [
  "specs/**/review-transcript.jsonl*",
  "site/dist/**",
  "site/package-lock.json",
  "specs/archive/**",
  "**/*.log",
  "coverage.out",
]
